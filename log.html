<!DOCTYPE html>
<!--
  ============================================================================
  更新日志页 log.html · 我的小窝
  ----------------------------------------------------------------------------
  页面结构（从上到下）：
    1. 顶部导航（由 assets/js/app.js 渲染）
    2. 宫崎骏风格内页背景
    3. 页面标题卡片 #pageHead —— 标题、简介、版本数量与最新版本由 main.js（Log 模块）填充
    4. 类型筛选栏 #logFilter —— 左边的文字是静态说明，右边的按钮由 main.js 插入
    5. 日志时间线 #logList —— main.js 在这里插入 .log-item，点类型按钮会即时重排
    6. 页脚（同样由 app.js 渲染）

  说明：日志存在数据库里，在后台「更新日志」标签发布，按时间倒序排，最新的版本在最上面。
  ============================================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新日志 · 我的小窝</title>
  <meta name="description" content="这个小窝的版本更新记录，按时间倒序排列。">
  <meta name="theme-color" content="#bfe3f7">
  <meta property="og:type" content="website">
  <meta property="og:title" content="更新日志 · 我的小窝">
  <meta property="og:description" content="这个小窝的版本更新记录，按时间倒序排列。">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ===================== 数据库设置 =====================
       config.js 里填 Supabase 的网址和密钥；store.js 是数据库连接层。
       这两个必须放在最前面，后面所有脚本都要用它们。 -->
  <script src="content/config.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    /* 先别急着画导航，等 main.js 把数据库里的网站设置取回来再画 */
    window.__NEST_DEFER_APP_BOOT = true;
  </script>
</head>

<body data-page="log">

  <!-- 宫崎骏风格内页背景：蓝天白云 + 青草地 + 少女撑伞（纯 SVG，无外部图片） -->
  <div class="bg-scene" aria-hidden="true"></div>

  <!-- 顶部导航占位：内容由 assets/js/app.js 生成 -->
  <header id="siteNav"></header>

  <!-- 阅读进度条 -->
  <div class="progress-bar" id="progressBar" aria-hidden="true"></div>

  <main>
    <div class="container">

      <!-- 页面标题卡片：标题、简介、版本数量与最新版本由 main.js（Log 模块）填充 -->
      <div id="pageHead"></div>

      <!-- 类型筛选：左边是静态说明文字，右边的按钮由 #logFilter 里 main.js 插入 -->
      <div class="toolbar glass" style="justify-content:space-between">
        <span class="field-label" style="margin:0">按类型筛选：</span>
        <div class="toolbar__chips" id="logFilter"></div>
      </div>

      <!-- 日志时间线：main.js 在这里插入 .log-item -->
      <div class="log-list" id="logList"></div>

    </div>
  </main>

  <!-- 页脚占位 -->
  <footer id="siteFooter"></footer>

  <!-- ===================== 脚本（顺序不能改） ===================== -->
  <script src="content/site.js"></script>
  <script src="content/posts.js"></script>
  <script src="content/moments.js"></script>
  <script src="content/logs.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/highlight.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/rain.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

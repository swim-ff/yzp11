<!DOCTYPE html>
<!--
  ============================================================================
  博文列表页 posts.html · 我的小窝
  ----------------------------------------------------------------------------
  页面结构（从上到下）：
    1. 顶部导航（由 assets/js/app.js 渲染，这里只留占位 div）
    2. 宫崎骏风格内页背景（纯 SVG，无外部图片）
    3. 页面标题卡片 #pageHead —— 标题、简介和统计小标签由 main.js（Posts 模块）填充
    4. 工具栏 #toolbar —— 搜索框 + 分类筛选 + 标签筛选 + 排序（main.js 渲染并绑定事件）
    5. 结果统计 #listInfo —— 显示当前的筛选条件和命中的文章数
    6. 博文卡片列表 #postList —— main.js 从 loader.js 整理好的数据里取文章渲染
    7. 分页 #postPager —— main.js 按每页若干篇生成上一页 / 页码 / 下一页
    8. 页脚（同样由 app.js 渲染）

  说明：首页的标签云跳过来时会带上 ?tag=xxx，main.js 会读取这个参数并自动筛选，
        所以这个页面不需要写任何内联脚本。
  ============================================================================
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博文 · 我的小窝</title>
  <meta name="description" content="我的技术笔记：编程、CTF、前端与算法，全部用 markdown 写作，支持代码高亮。">
  <meta name="theme-color" content="#bfe3f7">
  <meta property="og:type" content="website">
  <meta property="og:title" content="博文 · 我的小窝">
  <meta property="og:description" content="我的技术笔记：编程、CTF、前端与算法，全部用 markdown 写作，支持代码高亮。">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ===================== 数据库设置 =====================
       config.js 里填 Supabase 的网址和密钥；store.js 是数据库连接层。
       这两个必须放在最前面，后面所有脚本都要用它们。 -->
  <script src="content/config.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    /* 先别急着画导航，等 main.js 把数据库里的网站设置取回来再画 */
    window.__NEST_DEFER_APP_BOOT = true;
  </script>
</head>

<body data-page="posts">

  <!-- 宫崎骏风格内页背景：蓝天白云 + 青草地 + 少女撑伞（纯 SVG，无外部图片） -->
  <div class="bg-scene" aria-hidden="true"></div>

  <!-- 顶部导航占位：内容由 assets/js/app.js 生成 -->
  <header id="siteNav"></header>

  <!-- 阅读进度条 -->
  <div class="progress-bar" id="progressBar" aria-hidden="true"></div>

  <!-- 页面主体 -->
  <main>
    <div class="container">

      <!-- 页面标题卡片：标题、简介和几个统计小标签由 main.js（Posts 模块）填充 -->
      <div id="pageHead"></div>

      <!-- 工具栏：搜索框 + 分类筛选 + 标签筛选 + 排序，由 main.js（Posts.renderToolbar）渲染 -->
      <div id="toolbar"></div>

      <!-- 筛选结果统计文字：例如「筛选条件：标签「CTF」，共找到 3 篇」，由 main.js 更新 -->
      <p class="gb-hint" id="listInfo" style="margin:0 0 16px 2px"></p>

      <!-- 博文卡片列表：main.js（Posts.renderList）在这里插入 .post-card 卡片 -->
      <div class="post-grid" id="postList"></div>

      <!-- 分页按钮：main.js 根据文章总数动态生成，只有一页时留空 -->
      <nav class="pager" id="postPager" aria-label="分页"></nav>

    </div>
  </main>

  <!-- 页脚占位 -->
  <footer id="siteFooter"></footer>

  <!-- ===================== 脚本（顺序不能改） ===================== -->
  <script src="content/site.js"></script>
  <script src="content/posts.js"></script>
  <script src="content/moments.js"></script>
  <script src="content/logs.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/highlight.js"></script>
  <script src="assets/js/markdown.js"></script>
  <script src="assets/js/loader.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/rain.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>

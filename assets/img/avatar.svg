<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  头像 · assets/img/avatar.svg
  ----------------------------------------------------------------------------
  默认头像：一个戴耳机敲代码的小人（纯 SVG，不需要任何图片素材）。
  想换成自己的照片：直接把 assets/img/avatar.svg 换成 avatar.jpg，
  然后修改 content/site.js 里的 profile.avatar 字段为 "assets/img/avatar.jpg"。
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="小窝主人的默认头像">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#63b894"/>
      <stop offset="55%" stop-color="#2f8f6f"/>
      <stop offset="100%" stop-color="#10493a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.24" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3f3126"/>
      <stop offset="100%" stop-color="#241b14"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <rect width="200" height="200" fill="url(#glow)"/>

  <!-- 身后的小圆光斑，增加治愈感 -->
  <circle cx="150" cy="46" r="26" fill="#ffffff" opacity="0.12"/>
  <circle cx="34" cy="160" r="18" fill="#ffe9b8" opacity="0.18"/>

  <!-- 肩膀 / 衣服 -->
  <path d="M52 200 C 56 156 76 138 100 138 C 124 138 144 156 148 200 Z" fill="#fdfcf7" opacity="0.95"/>
  <path d="M100 138 L 100 200" stroke="#cddced" stroke-width="2" opacity="0.7"/>

  <!-- 脖子 -->
  <rect x="90" y="118" width="20" height="24" rx="8" fill="#f0d3bd"/>

  <!-- 头 -->
  <ellipse cx="100" cy="92" rx="42" ry="45" fill="#fbe3d2"/>

  <!-- 头发 -->
  <path d="M58 88 C 54 44 74 26 100 26 C 126 26 146 44 142 88
           C 134 62 122 52 100 52 C 78 52 66 62 58 88 Z" fill="url(#hair)"/>
  <path d="M58 86 C 52 108 58 126 66 132 C 60 108 62 94 66 80 Z" fill="url(#hair)"/>
  <path d="M142 86 C 148 108 142 126 134 132 C 140 108 138 94 134 80 Z" fill="url(#hair)"/>

  <!-- 耳机（写代码必备） -->
  <path d="M52 92 C 52 56 74 38 100 38 C 126 38 148 56 148 92"
        fill="none" stroke="#10493a" stroke-width="9" stroke-linecap="round"/>
  <rect x="42" y="84" width="16" height="30" rx="8" fill="#10493a"/>
  <rect x="142" y="84" width="16" height="30" rx="8" fill="#10493a"/>
  <rect x="45" y="88" width="10" height="22" rx="5" fill="#7fb069"/>

  <!-- 闭眼微笑 -->
  <path d="M80 92 C 84 87 90 87 94 92" stroke="#4a3527" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M106 92 C 110 87 116 87 120 92" stroke="#4a3527" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M92 110 C 97 115 103 115 108 110" stroke="#c2506f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="74" cy="104" rx="9" ry="6" fill="#ffb6ad" opacity="0.5"/>
  <ellipse cx="126" cy="104" rx="9" ry="6" fill="#ffb6ad" opacity="0.5"/>

  <!-- 前景：笔记本（暗示这是一个写代码的人） -->
  <path d="M62 200 L 74 168 L 140 176 L 130 200 Z" fill="#e8eef5"/>
  <path d="M74 168 L 140 176 L 138 182 L 72 174 Z" fill="#b9c8d8"/>
  <text x="96" y="194" font-family="monospace" font-size="11" fill="#2f8f6f" opacity="0.85">&lt;/&gt;</text>
</svg>
